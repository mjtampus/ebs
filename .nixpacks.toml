# .nixpacks.toml
[phases.setup]
# System packages needed for PHP extensions and Laravel/Node
aptPkgs = [
  "git",
  "curl",
  "zip",
  "unzip",
  "libicu-dev",
  "libzip-dev",
  "nodejs",
  "npm"
]

[phases.build]
cmds = [
  # Make sure system packages are up-to-date
  "apt-get update && apt-get install -y libicu-dev libzip-dev zip unzip",

  # Install required PHP extensions (intl and zip for Filament/OpenSpout)
  "install-php-extensions intl zip ctype curl dom fileinfo filter hash mbstring openssl pcre pdo session tokenizer xml",

  # Install Composer dependencies
  "composer install --optimize-autoloader --no-interaction",

  # Install Node packages and build frontend
  "npm install",
  "npm run build"
]

[phases.deploy]
cmds = [
  # Ensure Laravel storage and cache directories exist and are writable
  "mkdir -p storage/framework/{sessions,views,cache,testing} storage/logs bootstrap/cache",
  "chmod -R a+rw storage",

  # Laravel caching
  "php artisan config:cache",
  "php artisan route:cache",
  "php artisan view:cache",
  "php artisan event:cache"
]

[env]
APP_ENV = "production"
APP_DEBUG = "false"
